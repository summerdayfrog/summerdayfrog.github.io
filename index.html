<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>august archive</title>
<meta name="description" content="summer is for falling in love">
<!-- 검색엔진에 나오지 않게 한다 -->
<meta name="robots" content="noindex, nofollow, noarchive">
<!-- 글꼴: Pretendard (고딕체) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* Layout: a shelf of index cards on a pastel sky ground — masthead with tallies, a filter rail, then a wrapping grid of cards topped by thumbnails or generated covers. */
:root {
  --bg: #DCEEFB;
  --paper: #FFFFFF;
  --ink: #1B2A3A;
  --muted: #5A6E82;
  --line: #C3D9EC;
  --accent: #9CC3EE;          /* 버튼·배지: 하늘색보다 조금 짙은 파스텔 파랑 */
  --accent-ink: #15304D;      /* 파스텔 버튼 위 글자 */
  --accent-strong: #3A72B8;   /* 흰 바탕 위 파란 글자 (소제목·즐겨찾기 등) */
  --danger: #D2553F;          /* 오류·삭제 */
  --save: #8DB6E6;        /* 기록 ‘저장’ 버튼: 하늘색보다 조금 짙은 파스텔 파랑 */
  --save-hover: #79A6DE;
  --save-ink: #16304D;
  --chip: #CBE3F6;
  --edit: #FFF6DA;
  --edit-line: #EBCB6E;
  --cover-1: #4A7FB5; --cover-2: #E07A62; --cover-3: #4F9A8C;
  --cover-4: #8A74B8; --cover-5: #C9934A; --cover-6: #5C8FA8;
  --cover-ink: #FFFFFF;
  --shadow: 0 1px 0 rgba(27,42,58,.05), 0 8px 20px -12px rgba(27,42,58,.28);
  /* 모든 글꼴을 고딕체 하나로 통일 */
  --f-sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --f-display: var(--f-sans);
  --f-body: var(--f-sans);
  --f-hand: var(--f-sans);
  --f-mono: var(--f-sans);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 72px; display: grid; gap: 28px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

/* Masthead */
.mast { display: grid; gap: 18px; }
.mast-top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(36px, 6.5vw, 58px); line-height: 1.05; margin: 0; letter-spacing: -.035em; text-wrap: balance; }
.intro { margin: 10px 0 0; color: var(--muted); max-width: 52ch; }
.tally { display: flex; flex-wrap: wrap; margin: 0; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--line); }
.tally div { flex: 1 1 120px; padding: 10px 14px 10px 0; display: grid; gap: 2px; }
.tally div + div { padding-left: 14px; border-left: 1px solid var(--line); }
.tally dt { font-size: 12px; color: var(--muted); }
.tally dd { margin: 0; font-family: var(--f-mono); font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tally dd.word { font-family: var(--f-body); font-size: 18px; padding-top: 3px; }

.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--chip); filter: none; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }

/* Edit banner */
.editbar { background: var(--edit); border: 1px solid var(--edit-line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; }
.editbar p { margin: 0; font-size: 14px; }
/* 편집 창 최소화(–) / 펼치기(□) */
.winbtn { width: 28px; height: 28px; flex: none; display: grid; place-items: center; padding: 0; border: 0;
  background: none; color: var(--muted); font-size: 17px; line-height: 1; }
.winbtn:hover { color: var(--ink); }
/* 최소화하면 노란 상자 없이 상태 글만 파스텔 파랑 굵은 글씨로 */
.editbar.min { background: none; border-color: transparent; padding: 0 2px; }
.editbar.min #editTitle, .editbar.min #editHelp, .editbar.min #editActions, .editbar.min #ghForm, .editbar.min #resetSlot { display: none; }
.editbar.min .state { color: #5E95D4; font-weight: 700; font-size: 13px; }
.editbar.min .state.dirty { color: var(--danger); }
.editbar .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.editbar .state { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.editbar .state.dirty { color: var(--danger); }
.editbar .state.ok { color: #2F7D5B; }
.editbar p.err { color: var(--danger); }
.ghform { display: grid; gap: 10px; border-top: 1px dashed var(--edit-line); padding-top: 12px; }
.ghform .row3 { display: grid; grid-template-columns: 1fr 1fr 110px; gap: 10px; }
.ghform .field input { background: var(--paper); }
.ghform .hint { margin: 0; }
.ghform a { color: var(--ink); }
@media (max-width: 560px) { .ghform .row3 { grid-template-columns: 1fr; } }

/* Toolbar */
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.chip { border: 0; background: none; padding: 4px 0; font-size: 14.5px; color: var(--muted); font-weight: 400; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.chip.zero { opacity: .55; }
.chip.zero[aria-pressed="true"], .chip.zero:hover { opacity: 1; }
/* 볼드로 바뀌어도 옆 항목이 밀리지 않도록 볼드 폭만큼 자리를 미리 잡아둔다 */
.chip .lbl { display: inline-flex; flex-direction: column; }
.chip .lbl::after { content: attr(data-text); font-weight: 700; height: 0; visibility: hidden; overflow: hidden; user-select: none; }
.subrow { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 16px; padding-left: 4px; }
.subrow::before { content: "└"; color: var(--muted); font-size: 13px; margin-right: -8px; }
.subrow .chip { font-size: 13.5px; }
.subselects { display: grid; gap: 8px; }
.subsel { display: flex; align-items: center; gap: 6px; min-width: 0; }
.subsel.nested::before { content: "└"; color: var(--muted); font-size: 13px; }
.subsel select { flex: 1; min-width: 0; }
.chip .n { font-family: var(--f-mono); font-size: 11px; opacity: .65; margin-left: 4px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; flex: 1 1 260px; justify-content: flex-end; }
.tools input, .tools select { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14px; min-width: 0; }
.tools input { flex: 1 1 160px; max-width: 260px; }

/* Grid of cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; align-items: start; }
.card { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; display: grid; min-width: 0; }
.cover { position: relative; aspect-ratio: 16 / 9; max-width: 100%; color: var(--cover-ink); overflow: hidden; display: block; text-decoration: none; }
.cover .gen { position: absolute; inset: 0; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between;
  background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 2px, transparent 2px 9px); }
.cover .glyph { position: absolute; right: -6px; bottom: -30px; font-family: var(--f-display); font-weight: 800; font-size: 140px; line-height: 1; opacity: .2; pointer-events: none; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover .label { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.cover .label span, .cover .ex { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; background: rgba(10,14,12,.68); color: #F6F4EC; padding: 2px 8px; border-radius: 4px; }
.cover .ex { position: absolute; top: 10px; right: 10px; font-family: var(--f-body); letter-spacing: 0; }
.cover .play { position: absolute; left: 50%; top: 50%; width: 68px; height: 48px; margin: -24px 0 0 -34px; border-radius: 14px; background: rgba(10,14,12,.6); display: grid; place-items: center; transition: background .15s; }
.cover .play::after { content: ""; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
a.cover:hover .play, a.cover:focus-visible .play { background: var(--accent-strong); }
.card { cursor: pointer; }
.titlebtn { all: unset; cursor: pointer; }
.titlebtn:hover { color: var(--accent-strong); }
.titlebtn:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; border-radius: 2px; }
.preview-text { margin: 0; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

/* 크게 보기 */
.reader-overlay { position: fixed; inset: 0; z-index: 15; background: rgba(27,42,58,.5); overflow-y: auto; display: flex; justify-content: center; align-items: flex-start;
  padding: calc(32px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
.reader { background: var(--paper); width: min(760px, 100%); border-radius: 12px; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(27,42,58,.5); min-width: 0; }
.reader-top { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.reader-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }
.navbtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); font-size: 20px; line-height: 1; display: grid; place-items: center; color: var(--ink); }
.navbtn:hover:not(:disabled) { background: var(--chip); }
.navbtn:disabled { opacity: .35; cursor: default; }
.navbtn.close { font-size: 15px; }
.cover.big .glyph { font-size: 240px; bottom: -56px; }
.reader-body { padding: 24px 28px 28px; display: grid; gap: 14px; min-width: 0; }
.reader-meta { margin: 0; font-size: 13px; color: var(--muted); }
.reader-title { margin: 0; font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: -.03em; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.reader-one { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.5; padding-left: 14px; border-left: 3px solid var(--accent); overflow-wrap: anywhere; }
.reader .full { font-size: 16px; line-height: 1.8; border-top: 1px solid var(--line); padding-top: 18px; max-width: 65ch; }
.reader .full .sec { font-size: 13px; margin-top: 18px; }
.reader .full .sec:first-child { margin-top: 0; }
.reader-empty { margin: 0; color: var(--muted); }
/* 카테고리별 추가 항목 */
.extra-fields { display: grid; gap: 14px; }
.extra-fields:empty { display: none; }
.extra-fields textarea { min-height: 80px; }
.card .extras { margin: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.card .extras b { font-weight: 600; color: var(--ink); margin-right: 4px; }
.reader-extra { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 15px; }
.reader-extra dt { font-weight: 600; color: var(--accent-strong); font-size: 13px; padding-top: 2px; }
.reader-extra dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
@media (max-width: 480px) { .reader-extra { grid-template-columns: 1fr; gap: 2px; } .reader-extra dd { margin-bottom: 8px; } }
.reader .actions { padding-top: 6px; border-top: 1px solid var(--line); padding-top: 16px; }
.reader a.btn { text-decoration: none; }
@media (max-width: 560px) {
  .reader-overlay { padding: 0; }
  .reader { border-radius: 0; min-height: 100%; }
  .reader-top { position: sticky; top: 0; background: var(--paper); z-index: 1; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  .reader-body { padding: 20px 18px calc(28px + env(safe-area-inset-bottom, 0px)); }
}
.body { padding: 14px 16px 16px; display: grid; gap: 8px; min-width: 0; }
.title { font-weight: 600; font-size: 17px; line-height: 1.35; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.favmark { font-size: 13px; font-weight: 600; color: var(--accent-strong); }
.favbtn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted); }
.favbtn:hover { color: var(--ink); }
.favbtn[aria-pressed="true"] { color: var(--accent-strong); border-color: var(--accent-strong); font-weight: 600; }
.cover .favbadge { position: absolute; top: 10px; left: 10px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 15px; line-height: 1; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent-strong); margin: 0; }
.date { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.one { font-family: var(--f-hand); font-size: 15.5px; font-weight: 500; line-height: 1.45; margin: 0; overflow-wrap: anywhere; color: var(--ink); }
.full { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
.full .sec { display: block; font-size: 12px; font-weight: 600; color: var(--accent-strong); letter-spacing: .02em; margin-top: 6px; }
.full .sec:first-child { margin-top: 0; }
.lblrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 12px; color: var(--muted); background: var(--chip); padding: 1px 8px; border-radius: 4px; border: 0; }
.tag:hover { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
.link { color: var(--ink); font-weight: 600; font-size: 13px; text-decoration: none; border-bottom: 1.5px solid var(--accent); padding-bottom: 1px; }
.link:hover { color: var(--accent-strong); }
.textbtn { background: none; border: 0; padding: 4px 6px; font-size: 13px; color: var(--muted); }
.textbtn:hover { color: var(--ink); }
.spacer { flex: 1; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; background: var(--chip); padding: 8px 10px; border-radius: 6px; }

.empty, .notice { background: var(--paper); border: 1px dashed var(--line); border-radius: 8px; padding: 28px 22px; display: grid; gap: 8px; justify-items: start; }
.empty h2 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.02em; font-size: 26px; margin: 0; }
.empty p, .notice p { margin: 0; color: var(--muted); max-width: 56ch; }
.notice { padding: 12px 16px; border-style: solid; }

/* Sheet (add / edit) */
.overlay { position: fixed; inset: 0; background: rgba(10,14,12,.45); z-index: 20; display: flex; justify-content: flex-end; }
.sheet { background: var(--paper); width: min(480px, 100%); height: 100%; overflow-y: auto; padding: calc(22px + env(safe-area-inset-top, 0px)) 22px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; box-shadow: -10px 0 30px -12px rgba(0,0,0,.4); }
.sheet h2 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.02em; font-size: 28px; margin: 0; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: 13px; font-weight: 500; }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
.field textarea { min-height: 130px; resize: vertical; line-height: 1.55; }
/* 작성 칸이 화면보다 길어도 각 줄이 제 높이를 지키게 한다 (썸네일이 아래 칸과 겹치지 않도록) */
.sheet { grid-auto-rows: max-content; }
.btn.save { background: var(--save); color: var(--save-ink); }
.btn.save:hover { background: var(--save-hover); filter: none; }
.preview { aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--chip); min-height: 0; flex-shrink: 0; }
.preview img { width: 100%; height: 100%; object-fit: cover; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding-top: 4px; }
.autosave { font-size: 12px; color: var(--muted); margin-right: auto; }
.restore { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; background: var(--chip); border-radius: 8px; padding: 8px 12px; }
.restore .textbtn { padding: 2px 4px; text-decoration: underline; }
.err { color: var(--danger); font-size: 13px; margin: 0; }
footer { color: var(--muted); font-size: 12px; font-family: var(--f-mono); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
footer a { color: inherit; }
@media (prefers-reduced-motion: no-preference) {
  .card { transition: transform .15s ease; }
  .card:hover { transform: translateY(-2px); }
}
/* 컴퓨터·태블릿: 작성 창을 화면 가운데 네모난 창으로 띄우고 뒤를 흐리게 (휴대폰은 지금처럼 옆에서 나오는 화면) */
@media (min-width: 721px) {
  .overlay { justify-content: center; align-items: center; padding: 32px;
    background: rgba(27, 42, 58, .28); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .sheet { width: min(640px, 100%); height: auto; max-height: calc(100vh - 64px); max-height: calc(100dvh - 64px);
    border-radius: 0; padding: 28px 30px 0; box-shadow: 0 30px 70px -20px rgba(27, 42, 58, .45); }
  /* 길게 써도 저장 버튼이 항상 창 아래에 보이게 */
  .sheet-actions { position: sticky; bottom: 0; z-index: 1; background: var(--paper);
    margin: 0 -30px; padding: 14px 30px 18px; border-top: 1px solid var(--line); }
}
@media (min-width: 721px) and (prefers-reduced-motion: no-preference) {
  .overlay:not([hidden]) .sheet { animation: sheet-in .18s ease-out; }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
}
/* 잠금 화면: 연결 안내만 보여준다 */
body.locked .tally, body.locked .bar, body.locked #grid, body.locked #emptySlot, body.locked #addBtn { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mast-top">
      <div>
        <p class="eyebrow" id="siteEyebrow" hidden></p>
        <h1 id="siteTitle">august archive</h1>
        <p class="intro" id="siteIntro" hidden></p>
      </div>
      <button class="btn" id="addBtn" type="button" hidden>+ 새 기록</button>
    </div>
    <dl class="tally">
      <div><dt>전체 기록</dt><dd id="tTotal">0</dd></div>
      <div><dt>이번 달</dt><dd id="tMonth">0</dd></div>
      <div><dt>즐겨찾기</dt><dd id="tFav">0</dd></div>
      <div><dt>가장 많이 본</dt><dd id="tTop" class="word">–</dd></div>
    </dl>
  </header>

  <section class="editbar" id="editbar" hidden aria-label="편집 모드">
    <div class="row">
      <strong id="editTitle">편집 모드</strong>
      <span class="state" id="editState" role="status"></span>
      <span class="spacer"></span>
      <span id="resetSlot"></span>
      <button type="button" class="winbtn" id="editToggle" aria-label="편집 창 최소화" aria-expanded="true">–</button>
    </div>
    <p id="editHelp"></p>
    <div class="row" id="editActions"></div>

<script>
  /* reviews.js 를 읽다가 문제가 생기면 몇 번째 줄인지 기억해 둔다 */
  window.addEventListener("error", function (e) {

</script>
<script src="reviews.js" onerror="window.REVIEWS_MISSING = true"></script>
<script>
(function () {
  "use strict";
  var DRAFT_KEY = "summerdayfrog-archive_private-draft";
  var GH_KEY = "summerdayfrog-archive_private-github";   /* GitHub 토큰은 이 브라우저에만 저장된다 */
  /* 편집 창을 최소화해 뒀는지 (이 브라우저에 기억) */
  var BAR_KEY = DRAFT_KEY + "-bar";
  var editMin = false;
  try { editMin = localStorage.getItem(BAR_KEY) === "min"; } catch (e) {}
  document.getElementById("editToggle").addEventListener("click", function () {
    editMin = !editMin;
    try { if (editMin) localStorage.setItem(BAR_KEY, "min"); else localStorage.removeItem(BAR_KEY); } catch (e) {}
    renderEditbar();
  });
  /* 카테고리는 reviews.js 의 window.CATEGORIES 에서 읽는다 */
  var CATS = (Array.isArray(window.CATEGORIES) ? window.CATEGORIES : []).filter(function (c) { return c && c.id && c.label; });
  if (!CATS.length) CATS = [
    { id: "video", label: "영상" }, { id: "music", label: "음악" }, { id: "film", label: "영화·드라마" },
    { id: "book", label: "책" }, { id: "etc", label: "기타" }
  ];
  function catLabel(id) { for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].label; return id || "미분류"; }
  /* 카테고리별 후기 양식: reviews.js 에서 "template": ["■ 제목", "", ...] 처럼 줄 목록으로 적는다 */
  /* 하위 카테고리: reviews.js 에서 카테고리 안에 "sub": [{ "id": "...", "label": "..." }] 로 적는다 */
  function catOf(id) { for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i]; return null; }
  /* 하위 카테고리는 몇 단계든 "sub" 안에 "sub" 를 넣어 만든다.
     기록에는 경로를 "lecture/math" 처럼 / 로 이어서 저장한다. */
  function childrenOf(node) { return node && Array.isArray(node.sub) ? node.sub.filter(function (s) { return s && s.id && s.label; }) : []; }
  function splitPath(p) { return p ? String(p).split("/").filter(Boolean) : []; }
  function joinPath(prefix, id) { return prefix ? prefix + "/" + id : id; }
  /* 경로를 따라 내려가며 단계별 이름을 찾는다 (설정에서 지워진 단계는 id 를 그대로 쓴다) */
  function walk(catId, path) {
    var node = catOf(catId), out = [];
    splitPath(path).forEach(function (id) {
      var n = node ? childrenOf(node).find(function (x) { return x.id === id; }) || null : null;
      out.push({ id: id, label: n ? n.label : id, node: n });
      node = n;
    });
    return out;
  }
  function nodeAt(catId, path) { var w = walk(catId, path); return w.length ? w[w.length - 1].node : catOf(catId); }
  function underPath(sub, prefix) { return !prefix || sub === prefix || String(sub || "").indexOf(prefix + "/") === 0; }
  function fullCatLabel(it) { return [catLabel(it.category)].concat(walk(it.category, it.sub).map(function (s) { return s.label; })).join(" · "); }
  /* 양식은 가장 깊은 단계부터 위로 올라가며 처음 만나는 것을 쓴다 */
  function templateFor(id, path) {
    function txt(t) { return Array.isArray(t) ? t.join("\n") : String(t); }
    var steps = walk(id, path);
    for (var i = steps.length - 1; i >= 0; i--) if (steps[i].node && steps[i].node.template) return txt(steps[i].node.template);
    var c = catOf(id);
    return c && c.template ? txt(c.template) : "";
  }
  /* 소제목 줄: ■ 로 시작하거나, 어느 양식에든 적혀 있는 줄 (⁋제목, ✓후기 처럼 어떤 기호를 써도 된다) */
  function templateLines() {
    var set = {};
    (function visit(list) {
      (list || []).forEach(function (n) {
        if (!n) return;
        var t = Array.isArray(n.template) ? n.template : (n.template ? String(n.template).split("\n") : []);
        t.forEach(function (l) { l = String(l).trim(); if (l) set[l] = true; });
        visit(n.sub);
      });
    })(CATS);
    return set;
  }
  function headingTest() {
    var set = templateLines();
    return function (line) { return /^■/.test(line) || set[String(line).trim()] === true; };
  }
  /* 카테고리별 추가 항목: reviews.js 에서 "fields": [{ "id": "cast", "label": "출연" }, ...] 로 적는다.
     양식과 같이 가장 깊은 단계에 있는 것을 쓴다. type: text(기본) / long(여러 줄) / number / date */
  function nodeSetting(id, path, key) {
    var steps = walk(id, path);
    for (var i = steps.length - 1; i >= 0; i--) if (steps[i].node && steps[i].node[key] != null) return steps[i].node[key];
    var c = catOf(id);
    return c && c[key] != null ? c[key] : null;
  }
  function fieldsFor(id, path) {
    var f = nodeSetting(id, path, "fields");
    return (Array.isArray(f) ? f : []).filter(function (x) { return x && x.id && x.label; });
  }
  function bodyLabelFor(id, path) { var b = nodeSetting(id, path, "bodyLabel"); return typeof b === "string" && b.trim() ? b : "후기"; }
  /* 기록에 저장된 추가 항목을 [이름, 값, 여러 줄인지] 목록으로 (설정에서 지워진 항목은 id 를 이름으로) */
  function extraRows(it) {
    var ex = it.extra || {}, defs = fieldsFor(it.category, it.sub), rows = [], seen = {};
    defs.forEach(function (d) { var v = ex[d.id]; if (v != null && String(v).trim()) { rows.push([d.label, String(v), d.type === "long"]); } seen[d.id] = true; });
    Object.keys(ex).forEach(function (k) { if (!seen[k] && String(ex[k]).trim()) rows.push([k, String(ex[k]), false]); });
    return rows;
  }
  /* 저장할 때 내용을 안 채운 소제목 항목은 지운다 */
  function stripEmptySections(text) {
    var isHead = headingTest();
    var lines = text.split("\n"), out = [], i = 0;
    while (i < lines.length) {
      if (isHead(lines[i])) {
        var j = i + 1, content = [];
        while (j < lines.length && !isHead(lines[j])) { content.push(lines[j]); j++; }
        if (content.join("").trim()) { out.push(lines[i]); out = out.concat(content); }
        i = j;
      } else { out.push(lines[i]); i++; }
    }
    return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }
  /* 후기 본문: 소제목 줄은 강조해서 보여준다 (■ 는 떼고, 다른 기호는 그대로 둔다) */
  function bodyNode(text) {
    var isHead = headingTest();
    var p = el("p", { class: "full" }), prevSec = true;
    text.split("\n").forEach(function (line) {
      if (isHead(line)) { p.appendChild(el("strong", { class: "sec", text: line.replace(/^■\s*/, "").trim() })); prevSec = true; }
      else { if (!prevSec) p.appendChild(document.createTextNode("\n")); p.appendChild(document.createTextNode(line)); prevSec = false; }
    });
    return p;
  }

  /* 사이트 문구는 reviews.js 의 window.SITE 에서 읽는다. 빈 칸("")으로 두면 그 줄은 숨긴다 */
  var SITE = (window.SITE && typeof window.SITE === "object") ? window.SITE : {};
  function applySite() {
    function put(id, value) {
      if (typeof value !== "string") return;
      var node = document.getElementById(id);
      node.textContent = value; node.hidden = value.trim() === "";
    }
    put("siteTitle", SITE.title);
    put("siteEyebrow", SITE.eyebrow);
    put("siteIntro", SITE.intro);
    put("footNote", typeof SITE.footer === "string" ? SITE.footer : SITE.title);
    if (typeof SITE.title === "string" && SITE.title.trim()) document.title = SITE.title;
    if (typeof SITE.intro === "string") {
      var meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute("content", SITE.intro);
    }
  }
  applySite();

  var BASE = Array.isArray(window.REVIEWS) ? window.REVIEWS : null;
  var state = { edit: false, items: [], filter: "all", sub: "", tag: "", q: "", sort: "new",
                readerId: null, confirmId: null, confirmReset: false, editing: null };

  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === undefined || v === null || v === false) return;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmtDate(s) { return s ? s.replace(/-/g, ".") : ""; }
  function safeUrl(u) { try { var p = new URL(u); return (p.protocol === "https:" || p.protocol === "http:") ? p.href : null; } catch (e) { return null; } }

  /* 유튜브 링크에서 11자리 영상 코드를 꺼낸다 (si= 는 공유 추적값이라 무시) */
  function youtubeId(u) {
    if (!u) return null;
    var url; try { url = new URL(u); } catch (e) { return null; }
    var host = url.hostname.replace(/^www\.|^m\.|^music\./, "");
    var id = null;
    if (host === "youtu.be") id = url.pathname.split("/")[1];
    else if (host === "youtube.com" || host === "youtube-nocookie.com") {
      id = url.searchParams.get("v");
      if (!id) { var m = url.pathname.match(/^\/(shorts|embed|live|v)\/([^/?#]+)/); if (m) id = m[2]; }
    }
    return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  }
  function thumbFor(it) {
    var img = safeUrl(it.image || "");
    if (img) return img;
    var id = youtubeId(it.url);
    return id ? "https://img.youtube.com/vi/" + id + "/hqdefault.jpg" : null;
  }

  /* ---------- 데이터 ----------
     보기 모드: reviews.js 를 그대로 보여준다.
     편집 모드: 고친 내용을 이 브라우저에 임시 저장(draft)하고,
               GitHub 와 연결돼 있으면 바뀔 때마다 GitHub 의 reviews.js 에 바로 저장한다. */
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function byId(list) { var m = {}; (list || []).forEach(function (it) { m[it.id] = it; }); return m; }
  /* from → to 로 바뀐 내용(추가·수정·삭제)을 onto 위에 다시 적용한다 */
  function applyChanges(from, to, onto) {
    var a = byId(from), b = byId(to), out = clone(onto);
    Object.keys(b).forEach(function (id) {
      if (a[id] && same(a[id], b[id])) return;
      var i = out.findIndex(function (x) { return x.id === id; });
      if (i >= 0) out[i] = clone(b[id]); else out.push(clone(b[id]));
    });
    Object.keys(a).forEach(function (id) { if (!b[id]) out = out.filter(function (x) { return x.id !== id; }); });
    return out;
  }

  var gh = { cfg: readGh(), remote: null, status: "idle", message: "", pushing: false, again: false, timer: null, conflicts: 0 };
  function syncBase() { return gh.remote ? gh.remote.items : (BASE || []); }

  function readDraft() { try { var s = localStorage.getItem(DRAFT_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function writeDraft() {
    try {
      if (same(state.items, syncBase())) localStorage.removeItem(DRAFT_KEY);
      else localStorage.setItem(DRAFT_KEY, JSON.stringify({ v: 2, base: syncBase(), items: state.items }));
    } catch (e) {}
  }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  /* 임시 저장본을 최신 기록 위에 다시 얹는다 (그사이 다른 곳에서 바뀐 기록을 지우지 않도록) */
  function rebase(draft, onto) {
    if (!draft) return clone(onto);
    if (Array.isArray(draft)) return draft;
    if (!Array.isArray(draft.items) || !Array.isArray(draft.base) || same(draft.items, draft.base)) return clone(onto);
    return applyChanges(draft.base, draft.items, onto);
  }
  function isDirty() { return !same(state.items, syncBase()); }

  /* 공개 reviews.js 상태: null(정상) / "missing"(없음 → 비공개 저장소 방식) / "syntax"(쉼표 등 오류) */
  function fileProblem() {
    if (Array.isArray(window.REVIEWS)) return null;
    var e = window.REVIEWS_ERROR;
    if (window.REVIEWS_MISSING || !e || (e.line <= 1 && /</.test(e.msg || ""))) return "missing";
    return "syntax";
  }
  /* 공개 파일이 없고 이 기기에 GitHub 연결도 없으면 잠금 화면 */
  function isLocked() { return !gh.cfg && !BASE && fileProblem() === "missing"; }

  function load() {
    state.edit = location.hash === "#edit";
    var locked = isLocked();
    $("editbar").hidden = !(state.edit || locked);
    $("addBtn").hidden = !state.edit || locked;
    if (!state.edit && !locked) $("ghForm").hidden = true;
    var base = gh.remote ? gh.remote.items : (BASE || []);
    state.items = state.edit ? rebase(readDraft(), base) : clone(base);
    var link = $("editLink"); link.textContent = "";
    link.appendChild(state.edit
      ? el("a", { href: "#", text: "편집 모드 닫기", onclick: function (e) { e.preventDefault(); history.replaceState(null, "", location.pathname + location.search); load(); } })
      /* 잠금 화면에서는 연결 안내가 대신하니 숨긴다 */
      : locked ? document.createTextNode("")
      : el("a", { href: "#edit", text: "편집 모드 열기", onclick: function (e) { e.preventDefault(); history.replaceState(null, "", location.pathname + location.search + "#edit"); load(); window.scrollTo(0, 0); } }));
    render();
    /* GitHub 와 연결된 기기에서는 보기 모드에서도 GitHub 의 최신 기록을 읽는다 (비공개 저장소도 가능) */
    if (gh.cfg) ghSync(); else tryReopenSheet();
  }
  window.addEventListener("hashchange", load);

  function commit() { writeDraft(); state.confirmId = null; render(); schedulePush(); }

  /* ---------- GitHub 연결 ---------- */
  function readGh() {
    try { var o = JSON.parse(localStorage.getItem(GH_KEY) || "null"); return o && o.token && o.owner && o.repo ? o : null; } catch (e) { return null; }
  }
  function saveGh(cfg) { try { localStorage.setItem(GH_KEY, JSON.stringify(cfg)); return true; } catch (e) { return false; } }
  function clearGh() { try { localStorage.removeItem(GH_KEY); } catch (e) {} }
  /* 주소가 아이디.github.io 면 아이디와 저장소 이름을 미리 채운다 */
  function guessRepo() {

  function fillSubs(path) {

    state.editing = it ? it.id : null;
    $("formTitle").textContent = it ? "기록 수정" : "새 기록";
    $("fUrl").value = it ? it.url || "" : "";
    $("fTitle").value = it ? it.title || "" : "";
    var fallbackCat = (state.filter !== "all" && state.filter !== "fav") ? state.filter : CATS[0].id;
    $("fCat").value = it ? it.category || fallbackCat : fallbackCat;
    if (!$("fCat").value) $("fCat").value = CATS[0].id;
    $("fExtra").textContent = ""; extraCache = it ? clone(it.extra || {}) : {};
    fillSubs(it ? it.sub : (state.filter === $("fCat").value ? state.sub : ""));
    $("fDate").value = it ? it.watchedAt || "" : today();
    $("fOne").value = it ? it.oneLine || "" : "";
    lastTpl = it ? "" : curTemplate();
    $("fBody").value = it ? it.body || "" : lastTpl;
    updateTplBtn();
    $("fTags").value = it ? (it.tags || []).join(", ") : "";
    $("fImage").value = it ? it.image || "" : "";
    $("fFav").checked = !!(it && it.fav); updatePreview();
    $("fErr").hidden = true;
    sheetBaseline = readForm();
    /* 임시 저장된 내용이 있으면 불러온다 */
    var draft = skipRestore ? null : (readSheets().drafts || {})[sheetTarget()];
    $("fRestore").hidden = !draft; $("fSaved").textContent = "";
    if (draft) {
      applyForm(draft.form);
      var d = new Date(draft.savedAt);
      $("fRestoreText").textContent = "임시 저장된 내용을 불러왔어요 (" + (d.getMonth() + 1) + "월 " + d.getDate() + "일 " +
        String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ").";
    }
    $("overlay").hidden = false;
    var all = readSheets(); all.open = sheetTarget(); writeSheets(all);
    setTimeout(function () { (it || draft ? $("fTitle") : $("fUrl")).focus(); }, 0);
  }
  function closeSheet(saved) {
    if (saved === true) dropSheetDraft(sheetTarget());
    else {
      saveSheetNow();
      var all = readSheets(); delete all.open; writeSheets(all);
    }
    $("overlay").hidden = true; state.editing = null;
  }
  $("cancelBtn").addEventListener("click", function () { closeSheet(); });
  $("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("overlay").hidden) closeSheet(); });
  $("addBtn").addEventListener("click", function () { openSheet(null); });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = $("fErr");
    function fail(msg, field) { err.textContent = msg; err.hidden = false; $(field).focus(); }
    var title = $("fTitle").value.trim(), url = $("fUrl").value.trim(), image = $("fImage").value.trim();
    if (!title) return fail("제목을 적어 주세요.", "fTitle");
    if (url && !safeUrl(url)) return fail("링크는 https:// 로 시작하는 주소로 적어 주세요.", "fUrl");
    if (image && !safeUrl(image)) return fail("이미지 주소는 https:// 로 시작해야 해요.", "fImage");
    var prev = null;
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === state.editing) prev = state.items[i];
    var item = {
      id: prev ? prev.id : Date.now().toString(36),
      title: title, url: url, category: $("fCat").value, watchedAt: $("fDate").value,
      fav: $("fFav").checked, oneLine: $("fOne").value.trim(), body: stripEmptySections($("fBody").value),
      tags: $("fTags").value.split(/[,，#]/).map(function (t) { return t.trim(); }).filter(Boolean).slice(0, 12),
      createdAt: prev ? prev.createdAt : new Date().toISOString()
    };
    if (image) item.image = image;
    var subPath = formSubPath();
    if (subPath) item.sub = subPath;
    /* 추가 항목: 지금 보이는 칸의 값 + (분류가 그대로면) 설정에서 사라진 예전 항목도 지우지 않고 남긴다 */
    var extra = currentExtras();
    if (prev && prev.extra && prev.category === item.category && (prev.sub || "") === (item.sub || "")) {
      var shown = {}; fieldsFor(item.category, item.sub).forEach(function (d) { shown[d.id] = true; });
      Object.keys(prev.extra).forEach(function (k) { if (!shown[k] && !(k in extra)) extra[k] = prev.extra[k]; });
    }
    if (Object.keys(extra).length) item.extra = extra;
    if (prev) state.items = state.items.map(function (x) { return x.id === prev.id ? item : x; });
    else state.items.push(item);
    closeSheet(true); commit();
  });

  /* ---------- 내보내기 ---------- */
  function fileText(items) {
    var list = (items || state.items).slice().sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
    /* 카테고리(와 하위 카테고리·양식)를 사람이 읽고 고치기 쉬운 모양으로 적는다 */
    function catText(c, pad) {
      var head = pad + "{ \"id\": " + JSON.stringify(c.id) + ", \"label\": " + JSON.stringify(c.label);
      var parts = [];
      if (c.template) {
        var t = Array.isArray(c.template) ? c.template : String(c.template).split("\n");
        parts.push(pad + "  \"template\": [\n" + t.map(function (s) { return pad + "    " + JSON.stringify(s); }).join(",\n") + "\n" + pad + "  ]");
      }
      if (typeof c.bodyLabel === "string") parts.push(pad + "  \"bodyLabel\": " + JSON.stringify(c.bodyLabel));
      if (Array.isArray(c.fields) && c.fields.length) {
        parts.push(pad + "  \"fields\": [\n" + c.fields.filter(function (f) { return f && f.id; }).map(function (f) {
          var o = "{ \"id\": " + JSON.stringify(f.id) + ", \"label\": " + JSON.stringify(f.label || f.id);
          if (f.type) o += ", \"type\": " + JSON.stringify(f.type);
          if (f.placeholder) o += ", \"placeholder\": " + JSON.stringify(f.placeholder);
          return pad + "    " + o + " }";
        }).join(",\n") + "\n" + pad + "  ]");
      }
      if (Array.isArray(c.sub) && c.sub.length) {
        parts.push(pad + "  \"sub\": [\n" + c.sub.filter(function (s) { return s && s.id; }).map(function (s) { return catText(s, pad + "    "); }).join(",\n") + "\n" + pad + "  ]");
      }
      return parts.length ? head + ",\n" + parts.join(",\n") + "\n" + pad + "}" : head + " }";
    }
    var cats = CATS.map(function (c) { return catText(c, "  "); }).join(",\n");
    return "// 하경의 감상 노트 데이터 파일\n" +
           "// 사이트 주소 뒤에 #edit 을 붙여 편집 모드에서 GitHub와 연결하면, 기록을 저장할 때마다 이 파일이 자동으로 바뀌어요.\n" +
           "// 사이트 문구·카테고리·양식은 이 파일에서 직접 고치면 돼요.\n\n" +
           "// ── 사이트 문구 ──\n" +
           "// 따옴표 안의 글자만 바꾸면 돼요. 빈 칸(\"\")으로 두면 그 줄은 화면에서 숨겨져요.\n" +
           "window.SITE = {\n" +
           "  \"title\": " + JSON.stringify(SITE.title != null ? SITE.title : $("siteTitle").textContent) + ",      // 큰 제목 (브라우저 탭 이름도 같이 바뀌어요)\n" +
           "  \"eyebrow\": " + JSON.stringify(SITE.eyebrow != null ? SITE.eyebrow : $("siteEyebrow").textContent) + ",    // 제목 위 작은 글씨\n" +
           "  \"intro\": " + JSON.stringify(SITE.intro != null ? SITE.intro : $("siteIntro").textContent) + ",      // 제목 아래 소개 문구\n" +
           "  \"footer\": " + JSON.stringify(SITE.footer != null ? SITE.footer : $("footNote").textContent) + "      // 맨 아래 작은 글씨\n" +
           "};\n\n" +
           "// ── 카테고리 ──\n" +
           "// id: 기록과 연결되는 영문 이름 (한 번 정하면 바꾸지 않기)\n" +
           "// label: 화면에 보이는 이름 (자유롭게 바꿔도 됨)\n" +
           "// 순서대로 필터와 작성 화면에 나와요.\n" +
           "// template: (선택) 이 분류로 새 기록을 쓸 때 후기 칸에 미리 채워지는 양식. 한 줄에 하나씩, ■ 로 시작하면 소제목\n" +
           "// sub: (선택) 하위 카테고리 목록. 모양은 카테고리와 같고, 하위 카테고리에도 template 을 붙일 수 있어요\n" +
           "// fields: (선택) 이 분류에만 생기는 추가 입력칸. { \"id\": 영문 이름, \"label\": 보이는 이름, \"type\": text·long·number·date }\n" +
           "// bodyLabel: (선택) 후기 칸의 이름 (예: \"기억\", \"감상\")\n" +
           "window.CATEGORIES = [\n" + cats + "\n];\n\n" +
           "// ── 기록 ──\n" +
           "window.REVIEWS = " + JSON.stringify(list, null, 2) + ";\n";
  }
  function doExport() {
    var blob = new Blob([fileText()], { type: "text/javascript;charset=utf-8" });
    var a = el("a", { href: URL.createObjectURL(blob), download: "reviews.js" });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function doCopy(e) {
    var btn = e.currentTarget, text = fileText();
    function done(msg) { btn.textContent = msg; setTimeout(function () { btn.textContent = "내용 복사"; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("복사됨"); }, function () { done("복사 실패"); });
    else done("복사 실패");
  }

  /* ---------- 검색 / 정렬 ---------- */
  var qTimer;
  $("q").addEventListener("input", function () { var v = this.value; clearTimeout(qTimer); qTimer = setTimeout(function () { state.q = v; render(); }, 120); });
  try { var savedSort = localStorage.getItem("hakyung-notes-sort"); if (savedSort && /^(new|watched|fav)$/.test(savedSort)) { state.sort = savedSort; $("sort").value = savedSort; } } catch (e) {}
  $("sort").addEventListener("change", function () { state.sort = this.value; try { localStorage.setItem("hakyung-notes-sort", this.value); } catch (e) {} render(); });

  load();
})();
</script>
</body>
</html>
